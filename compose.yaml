services:
  lmd:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT}
  db:
    image: postgres:alpine
    profiles:
      - local-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
