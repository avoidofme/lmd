name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: Testing and scanning for security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@7

      - name: Setup go
        uses: setup-go@v7
        with:
          go-version: "1.27"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif-file: "trivy-results.sarif"

      - name: Build docker image
        run: |
          docker build -t "lmd:latest" .

      - name: Scan docker image with trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "lmd:latest"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
